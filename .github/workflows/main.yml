name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          if [ ! -f "gradlew" ]; then
            gradle init --type basic
            echo "include ':app'" > settings.gradle
            mkdir -p app
            printf "plugins {\n    id 'com.android.application'\n}\nandroid {\n    namespace 'com.aistudy.app'\n    compileSdk 33\n}" > app/build.gradle
          fi
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyApp-APK
          path: "**/*.apk"
          
