name: Generate APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          if [ ! -f "gradlew" ]; then
            gradle init --type basic
            printf "plugins {\n    id 'com.android.application'\n}\nandroid {\n    namespace 'com.aistudy.app'\n    compileSdk 33\n}" > build.gradle
          fi
          ./gradlew assembleDebug || echo "Manual fix required"
      - name: Upload APK Link
        uses: actions/upload-artifact@v4
        with:
          name: AI-Study-App-APK
          path: "**/*.apk"
          
